name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_public_source.py
      - run: python3 -m py_compile scripts/*.py
      - run: c++ -std=c++17 -pthread -fsanitize=address,undefined -Iinclude src/main/immersive_tracking.cpp tests/vr_tracking.cpp -o /tmp/vr-tracking-tests
      - run: /tmp/vr-tracking-tests
